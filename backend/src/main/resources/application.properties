spring.application.name=servilink-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servilink}
spring.datasource.username=${DB_USER:servilink}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
# Commit desplegado: lo inyecta la imagen Docker (ARG GIT_SHA); sirve para verificar el despliegue.
info.commit=${COMMIT_SHA:desconocido}
# El secreto JWT no tiene valor por defecto: la aplicación no arranca sin él (mínimo 32 caracteres).
servilink.jwt-secret=${JWT_SECRET:}
servilink.comision=0.10
servilink.fcm-url=${FCM_URL:https://fcm.googleapis.com/v1/projects/servilink/messages:send}
servilink.nominatim-url=${NOMINATIM_URL:https://nominatim.openstreetmap.org/search}
servilink.nominatim-contacto=${NOMINATIM_CONTACTO:}
servilink.reintentos-habilitados=true
servilink.reintentos-cada-ms=30000
# Parámetros del ERS (sección 4): ventanas en minutos, saldo mínimo para postularse en COP.
servilink.ventana-postulacion-min=10
servilink.ventana-eleccion-min=5
servilink.saldo-minimo=40000
servilink.token-vigencia-seg=${TOKEN_VIGENCIA_SEG:900}
# Renovación de sesión: el token de renovación dura 7 días y una sesión no pasa de 30 días sin volver a iniciar.
servilink.renovacion-vigencia-seg=${RENOVACION_VIGENCIA_SEG:604800}
servilink.renovacion-maxima-seg=${RENOVACION_MAXIMA_SEG:2592000}
# La cookie de renovación va con Secure; solo se desactiva para probar sin HTTPS.
servilink.cookie-segura=${COOKIE_SEGURA:true}
# Sustituto de Wompi (RF-038) solo para demostraciones: en producción debe estar en false.
servilink.recarga-demo-habilitada=false
# Fotos de la solicitud: 2 MB por archivo (RF-022); el servicio vuelve a verificar el tamaño y el contenido.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Administrador inicial (opcional): se crea al arrancar si no existe. La clave exige al menos 12 caracteres.
servilink.admin-correo=${ADMIN_CORREO:}
servilink.admin-clave=${ADMIN_CLAVE:}
# Las respuestas (incluidos los archivos de la plataforma web) viajan siempre en UTF-8.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.tomcat.mime-mappings.webmanifest=application/manifest+json

# ---- Observabilidad (FPI-29) ----
# Métricas: histogramas para calcular el p95 en Prometheus (solo en lo que se mide: tráfico HTTP y la asignación).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.servilink.asignacion=true
management.metrics.tags.application=${spring.application.name}
# El endpoint /actuator/prometheus exige HTTP Basic; sin METRICAS_CLAVE (mínimo 16 caracteres) queda cerrado.
servilink.metricas-usuario=${METRICAS_USUARIO:prometheus}
servilink.metricas-clave=${METRICAS_CLAVE:}
# Trazas: se conserva el 10 % (rango 0,1-0,2 del criterio de la guía). Por defecto no se exportan a ningún lado;
# el stack local (docker/observabilidad) las envía con OTEL_EXPORT=true y OTEL_ENDPOINT.
management.tracing.sampling.probability=${TRAZAS_MUESTREO:0.1}
management.tracing.export.otlp.enabled=${OTEL_EXPORT:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
# Registros en JSON (formato ECS) con traceId y spanId para correlacionar con la traza.
logging.structured.format.console=${LOG_FORMATO:ecs}

# ---- Pagos con Wompi (RF-038) ----
# Sin llaves el servidor responde PAYMENT_UNAVAILABLE en lugar de fingir un pago. Los secretos solo van como variables de entorno.
servilink.wompi-llave-publica=${WOMPI_LLAVE_PUBLICA:}
servilink.wompi-secreto-integridad=${WOMPI_SECRETO_INTEGRIDAD:}
servilink.wompi-secreto-eventos=${WOMPI_SECRETO_EVENTOS:}
servilink.wompi-checkout-url=${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}
servilink.cloudinary-cloud-name=${CLOUDINARY_CLOUD_NAME:}
servilink.cloudinary-api-key=${CLOUDINARY_API_KEY:}
servilink.cloudinary-api-secret=${CLOUDINARY_API_SECRET:}
servilink.cloudinary-upload-url=${CLOUDINARY_UPLOAD_URL:https://api.cloudinary.com/v1_1}
servilink.cloudinary-delivery-url=${CLOUDINARY_DELIVERY_URL:https://res.cloudinary.com}
# Dirección pública de la plataforma: a ella vuelve el técnico después de pagar en Wompi.
servilink.url-publica=${URL_PUBLICA:}
