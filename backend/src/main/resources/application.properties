spring.application.name=servilink-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servilink}
spring.datasource.username=${DB_USER:servilink}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
# El secreto JWT no tiene valor por defecto: la aplicación no arranca sin él (mínimo 32 caracteres).
servilink.jwt-secret=${JWT_SECRET:}
servilink.comision=0.10
servilink.fcm-url=${FCM_URL:https://fcm.googleapis.com/v1/projects/servilink/messages:send}
servilink.reintentos-habilitados=true
servilink.reintentos-cada-ms=30000
# Parámetros del ERS (sección 4): ventanas en minutos, saldo mínimo para postularse en COP.
servilink.ventana-postulacion-min=10
servilink.ventana-eleccion-min=5
servilink.saldo-minimo=40000
servilink.token-vigencia-seg=${TOKEN_VIGENCIA_SEG:900}
# Sustituto de Wompi (RF-038) solo para demostraciones: en producción debe estar en false.
servilink.recarga-demo-habilitada=false
# Fotos de la solicitud: 2 MB por archivo (RF-022); el servicio vuelve a verificar el tamaño y el contenido.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Administrador inicial (opcional): se crea al arrancar si no existe. La clave exige al menos 12 caracteres.
servilink.admin-correo=${ADMIN_CORREO:}
servilink.admin-clave=${ADMIN_CLAVE:}
# Las respuestas (incluidos los archivos de la plataforma web) viajan siempre en UTF-8.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.tomcat.mime-mappings.webmanifest=application/manifest+json
