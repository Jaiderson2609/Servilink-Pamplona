spring.datasource.url=${TEST_POSTGRES_URL:jdbc:postgresql://localhost:5432/servilink_test}
spring.datasource.username=${TEST_POSTGRES_USER:postgres}
spring.datasource.password=${TEST_POSTGRES_PASSWORD:postgres}
servilink.jwt-secret=clave-de-pruebas-de-al-menos-32-caracteres-0123
servilink.reintentos-habilitados=false
servilink.recarga-demo-habilitada=true
# Observabilidad: en pruebas se conserva el 100 % de las trazas y el endpoint de métricas tiene clave conocida.
management.tracing.sampling.probability=1.0
servilink.metricas-usuario=prometheus
servilink.metricas-clave=clave-de-metricas-de-pruebas
# Spring Boot apaga la exportación de métricas en las pruebas; aquí se enciende la de Prometheus a propósito.
management.prometheus.metrics.export.enabled=true
# Wompi de pruebas: llaves ficticias, solo sirven para firmar y verificar dentro de las pruebas.
servilink.wompi-llave-publica=pub_test_ficticia
servilink.wompi-secreto-integridad=test_integrity_ficticio
servilink.wompi-secreto-eventos=test_events_ficticio
servilink.url-publica=https://servilink.ejemplo.co
# Cloudinary de pruebas: credenciales ficticias, solo sirven para firmar y verificar dentro de las pruebas.
servilink.cloudinary-cloud-name=nube-de-pruebas
servilink.cloudinary-api-key=123456789012345
servilink.cloudinary-api-secret=secreto_cloudinary_ficticio
