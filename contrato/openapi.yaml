openapi: 3.0.3
info:
  title: API de ServiLink Pamplona
  description: >-
    Contrato de la API REST del monolito modular, alineado con la sección 9 del DDS 2.0: prefijo /api/v1, rutas en
    inglés y kebab-case, POST para crear y PATCH para cambiar estado, Idempotency-Key en las operaciones marcadas y
    errores con la forma {code, message, traceId}.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local
  - url: https://servilink-staging.onrender.com/api/v1
    description: Staging (Render)
security:
  - bearerAuth: []
tags:
  - name: Identidad
  - name: Solicitudes
  - name: Postulaciones
  - name: Ejecución
  - name: Técnico
  - name: Ubicación
  - name: Billetera
  - name: Chat y calificación
  - name: Administración
paths:
  /auth/register:
    post:
      tags: [Identidad]
      summary: Crear una cuenta de hogar o técnico con consentimiento
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroRequest' }
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroResponse' }
        '400': { $ref: '#/components/responses/Invalida' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /auth/login:
    post:
      tags: [Identidad]
      summary: Iniciar sesión y obtener un JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /me:
    get:
      tags: [Identidad]
      summary: Perfil del usuario autenticado
      responses:
        '200':
          description: Perfil propio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /trades:
    get:
      tags: [Solicitudes]
      summary: Listar los oficios disponibles
      responses:
        '200':
          description: Catálogo de oficios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Oficio' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /service-requests:
    post:
      tags: [Solicitudes]
      summary: Publicar una solicitud de servicio (rol HOGAR)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudCrear' }
      responses:
        '201':
          description: Solicitud creada en estado E01 (Abierta)
          headers:
            Location:
              description: URI de la solicitud creada
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudResponse' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /service-requests/mine:
    get:
      tags: [Solicitudes]
      summary: Solicitudes propias (hogar) o servicios en los que participa (técnico)
      responses:
        '200':
          description: Lista de solicitudes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SolicitudResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /service-requests/open:
    get:
      tags: [Solicitudes]
      summary: Solicitudes abiertas dentro de la zona de trabajo del técnico, de la más cercana a la más lejana
      responses:
        '200':
          description: Solicitudes abiertas con distanciaM cuando el técnico definió su zona
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SolicitudResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /service-requests/{solicitudId}:
    get:
      tags: [Solicitudes]
      summary: Consultar una solicitud propia o a la que se postuló
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
      responses:
        '200':
          description: Detalle de la solicitud
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /service-requests/{solicitudId}/applications:
    post:
      tags: [Postulaciones]
      summary: Postularse con un precio (rol TECNICO)
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostulacionCrear' }
      responses:
        '201':
          description: Postulación registrada; la primera lleva la solicitud a E02
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostulacionResponse' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '410': { $ref: '#/components/responses/Expirada' }
        '422': { $ref: '#/components/responses/NoProcesable' }
    get:
      tags: [Postulaciones]
      summary: Ofertas recibidas por la solicitud (rol HOGAR dueño)
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
      responses:
        '200':
          description: Postulaciones con la reputación de cada técnico
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PostulacionResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /applications/{postulacionId}/select:
    patch:
      tags: [Postulaciones]
      summary: Elegir al técnico y retener su comisión (E02 a E03)
      parameters:
        - { $ref: '#/components/parameters/PostulacionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Técnico asignado; el contacto se muestra solo a partir de E03
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsignacionResponse' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '410': { $ref: '#/components/responses/Expirada' }
        '422': { $ref: '#/components/responses/NoProcesable' }
  /service-requests/{solicitudId}/arrive:
    patch:
      tags: [Ejecución]
      summary: El técnico asignado marca su llegada (E03 a E04)
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
      responses:
        '200': { $ref: '#/components/responses/SolicitudActualizada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /service-requests/{solicitudId}/complete:
    patch:
      tags: [Ejecución]
      summary: El técnico marca el trabajo como terminado
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
      responses:
        '200': { $ref: '#/components/responses/SolicitudActualizada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /service-requests/{solicitudId}/confirm:
    patch:
      tags: [Ejecución]
      summary: El hogar confirma; la retención pasa a comisión (E04 a E05)
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
      responses:
        '200': { $ref: '#/components/responses/SolicitudActualizada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /service-requests/{solicitudId}/cancel:
    patch:
      tags: [Ejecución]
      summary: Cancelar (E07); el motivo es obligatorio desde E03 y libera la retención
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cancelacion' }
      responses:
        '200': { $ref: '#/components/responses/SolicitudActualizada' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /service-requests/{solicitudId}/photos:
    post:
      tags: [Solicitudes]
      summary: Agregar una foto (máximo 3, hasta 2 MB; JPEG, PNG o WebP verificado por contenido)
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto: { type: string, format: binary }
      responses:
        '201':
          description: Foto guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FotoResumen' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '413': { $ref: '#/components/responses/Invalida' }
        '415': { $ref: '#/components/responses/Invalida' }
    get:
      tags: [Solicitudes]
      summary: Listar las fotos de la solicitud (participantes y técnicos que la ven abierta)
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
      responses:
        '200':
          description: Fotos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FotoResumen' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /uploads/signature:
    post:
      tags: [Solicitudes]
      summary: Firmar la subida directa de una foto a Cloudinary (solo el hogar dueño; el secreto nunca sale del servidor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solicitudId]
              properties:
                solicitudId: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Parámetros para subir a Cloudinary; el identificador público lo fija el servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmaSubida' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '429':
          description: Demasiadas firmas en la última hora (RATE_LIMITED, máximo 20 por usuario)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApi' }
        '503':
          description: Cloudinary no está configurado (UPLOAD_UNAVAILABLE); el cliente usa la subida por el API
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApi' }
  /service-requests/{solicitudId}/photos/cloudinary:
    post:
      tags: [Solicitudes]
      summary: Registrar una foto que el navegador ya subió a Cloudinary (se verifica la firma de la respuesta)
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicId, version, signature]
              properties:
                publicId: { type: string, maxLength: 200, description: 'servilink/solicitudes/{id}/{32 hex}' }
                version: { type: string, pattern: '^\\d{1,12}$' }
                signature: { type: string, maxLength: 128, description: Firma que devolvió Cloudinary (SHA-1 o SHA-256 de public_id y version más el secreto) }
                format: { type: string, enum: [jpg, jpeg, png, webp] }
      responses:
        '201':
          description: Foto registrada (idempotente por publicId)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FotoResumen' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401':
          description: No autenticado, o la firma de la foto no es válida (INVALID_SIGNATURE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApi' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '415': { $ref: '#/components/responses/Invalida' }
        '503':
          description: Cloudinary no está configurado (UPLOAD_UNAVAILABLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApi' }
  /service-requests/{solicitudId}/photos/{fotoId}:
    get:
      tags: [Solicitudes]
      summary: Descargar una foto
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
        - { name: fotoId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Contenido de la imagen
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '302':
          description: La foto vive en Cloudinary; se redirige a su dirección (el permiso se comprueba antes)
          headers:
            Location: { schema: { type: string, format: uri } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /service-requests/{solicitudId}/messages:
    post:
      tags: [Chat y calificación]
      summary: Enviar un mensaje (solo en E03 y E04)
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MensajeCrear' }
      responses:
        '201':
          description: Mensaje enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MensajeResponse' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/NoProcesable' }
    get:
      tags: [Chat y calificación]
      summary: Leer los mensajes; con despues se traen solo los nuevos
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
        - { name: despues, in: query, required: false, schema: { type: integer, format: int64, default: 0 } }
      responses:
        '200':
          description: Mensajes en orden
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MensajeResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/NoProcesable' }
  /service-requests/{solicitudId}/ratings:
    post:
      tags: [Chat y calificación]
      summary: Calificar a la contraparte (solo en E05, una vez por participante)
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalificacionCrear' }
      responses:
        '201':
          description: Calificación registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalificacionResponse' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /technicians/{tecnicoId}/reputation:
    get:
      tags: [Chat y calificación]
      summary: Promedio y cantidad de calificaciones de un técnico
      parameters:
        - { name: tecnicoId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Reputación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reputacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /technicians/me/location:
    put:
      tags: [Técnico]
      summary: Definir la zona de trabajo (punto base y radio en km)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZonaTrabajo' }
      responses:
        '200':
          description: Zona guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZonaTrabajoResponse' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    get:
      tags: [Técnico]
      summary: Consultar la zona de trabajo
      responses:
        '200':
          description: Zona vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZonaTrabajoResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /geocoding/search:
    get:
      tags: [Ubicación]
      summary: Buscar una dirección y obtener sus coordenadas (Nominatim, a través del servidor)
      description: >-
        Solo debe invocarse cuando el usuario toca "Buscar"; no se usa para autocompletar mientras escribe.
        El servidor guarda los resultados en caché y hace como máximo una petición por segundo a Nominatim.
        Atribución obligatoria: © colaboradores de OpenStreetMap.
      parameters:
        - name: q
          in: query
          required: true
          description: Dirección o lugar, de 3 a 200 caracteres
          schema: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '200':
          description: Hasta 5 lugares encontrados; arreglo vacío si no hay coincidencias
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: { $ref: '#/components/schemas/LugarEncontrado' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '429':
          description: Demasiadas búsquedas en espera (RATE_LIMITED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApi' }
        '503':
          description: El proveedor de direcciones no responde (GEOCODING_UNAVAILABLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApi' }
  /wallet:
    get:
      tags: [Billetera]
      summary: Saldo disponible, retenido y últimos movimientos (rol TECNICO)
      responses:
        '200':
          description: Estado de la billetera
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BilleteraResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /wallet/topups:
    post:
      tags: [Billetera]
      summary: Iniciar una recarga con Wompi
      description: >-
        Crea un intento de recarga PENDING con una referencia única y devuelve la dirección del pago en Wompi
        (Web Checkout, modo de pruebas hasta la entrega). No mueve dinero: el saldo sube solo cuando llega el
        evento firmado de Wompi (POST /webhooks/wompi) con el pago aprobado. Máximo 5 intentos por hora.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecargaCrear' }
      responses:
        '201':
          description: Intento creado; el cliente redirige al técnico a urlPago
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecargaIniciada' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '429':
          description: Demasiados intentos de recarga en la última hora (RATE_LIMITED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApi' }
        '503':
          description: Wompi no está configurado en este entorno (PAYMENT_UNAVAILABLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApi' }
  /wallet/topups/{referencia}:
    get:
      tags: [Billetera]
      summary: Consultar el estado de una recarga propia
      description: La pantalla a la que vuelve el técnico después de pagar la consulta hasta que deja de estar PENDING.
      parameters:
        - { name: referencia, in: path, required: true, schema: { type: string, maxLength: 40 } }
      responses:
        '200':
          description: Estado de la recarga
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoRecarga' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /wallet/topups/demo:
    post:
      tags: [Billetera]
      summary: Recarga de demostración (solo si el servidor la habilita)
      description: Sustituto de Wompi para demostraciones. Responde 404 cuando no está habilitada, que es el caso de producción.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecargaCrear' }
      responses:
        '200':
          description: Recarga acreditada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BilleteraResponse' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /webhooks/wompi:
    post:
      tags: [Billetera]
      summary: Evento firmado de Wompi
      description: >-
        Lo llama Wompi, no un usuario: no lleva JWT. La autenticidad la da la firma (SHA-256 de los campos de
        signature.properties tomados de data, más timestamp y el secreto de eventos), que viene en
        signature.checksum y en la cabecera X-Event-Checksum. Un pago APPROVED con el monto de la recarga la
        acredita una sola vez; repetir el evento responde 200 sin cambios.
      security: []
      parameters:
        - { name: X-Event-Checksum, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventoWompi' }
      responses:
        '200':
          description: Evento procesado, ignorado o ya procesado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoEvento' }
        '401':
          description: La firma no coincide (INVALID_SIGNATURE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApi' }
  /admin/summary:
    get:
      tags: [Administración]
      summary: Conteos por estado, usuarios por rol y comisiones
      responses:
        '200':
          description: Resumen de la plataforma
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenAdmin' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /admin/users:
    get:
      tags: [Administración]
      summary: Listar usuarios con filtro por rol y búsqueda por nombre o correo
      parameters:
        - { name: rol, in: query, required: false, schema: { type: string, enum: [HOGAR, TECNICO, ADMIN] } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaUsuarios' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /admin/users/{usuarioId}/status:
    patch:
      tags: [Administración]
      summary: Suspender o reactivar una cuenta; deja huella en la auditoría
      parameters:
        - { name: usuarioId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstadoCuenta' }
      responses:
        '200':
          description: Cuenta actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioAdmin' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /admin/service-requests:
    get:
      tags: [Administración]
      summary: Listar solicitudes, con filtro por estado
      parameters:
        - { name: estado, in: query, required: false, schema: { type: string, enum: [E01, E02, E03, E04, E05, E06, E07] } }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Página de solicitudes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaSolicitudes' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /admin/service-requests/{solicitudId}/cancel:
    patch:
      tags: [Administración]
      summary: Cancelar una solicitud por disputa; libera la comisión y avisa a las partes
      parameters:
        - { $ref: '#/components/parameters/SolicitudId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MotivoAdmin' }
      responses:
        '200':
          description: Solicitud cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudAdmin' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /admin/ledger:
    get:
      tags: [Administración]
      summary: Libro de movimientos de una solicitud
      parameters:
        - { name: solicitudId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Asientos de la solicitud
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MovimientoAdmin' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /admin/audit-events:
    get:
      tags: [Administración]
      summary: Auditoría de las acciones administrativas, la más reciente primero
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Página de eventos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAuditoria' }
        '400': { $ref: '#/components/responses/Invalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SolicitudId:
      name: solicitudId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PostulacionId:
      name: postulacionId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Clave única por intento (8 a 80 caracteres: letras, números, guion y guion bajo). Un reintento con la misma clave
        devuelve la respuesta guardada, con la cabecera Idempotent-Replay, y no repite la operación. Vigencia de 24 horas.
      schema: { type: string, minLength: 8, maxLength: 80, pattern: '^[A-Za-z0-9_-]+$' }
    Pagina:
      name: pagina
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Tamano:
      name: tamano
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    SolicitudActualizada:
      description: Solicitud con su nuevo estado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SolicitudResponse' }
    Invalida:
      description: Datos de entrada inválidos (VALIDATION_ERROR, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorApi' }
    NoAutenticado:
      description: Token ausente, vencido o con firma inválida (UNAUTHENTICATED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorApi' }
    SinPermiso:
      description: Token válido, pero sin rol o propiedad sobre el recurso (FORBIDDEN, ACCOUNT_SUSPENDED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorApi' }
    NoEncontrado:
      description: El recurso no existe (NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorApi' }
    Conflicto:
      description: >-
        Choca con el estado actual (ACTIVE_REQUEST_EXISTS, DUPLICATE_APPLICATION, INVALID_STATE_TRANSITION,
        TECHNICIAN_UNAVAILABLE, EMAIL_ALREADY_REGISTERED, PHOTO_LIMIT_REACHED, DUPLICATE_RATING, CONFLICT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorApi' }
    Expirada:
      description: La ventana de tiempo ya cerró (SERVICE_EXPIRED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorApi' }
    NoProcesable:
      description: Regla de negocio no cumplida (WALLET_BELOW_MINIMUM, INSUFFICIENT_BALANCE, CHAT_CLOSED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorApi' }
  schemas:
    ErrorApi:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          example: SERVICE_EXPIRED
          description: Código estable del catálogo de errores del DDS 11.1
        message: { type: string, example: La ventana de selección terminó }
        traceId: { type: string, format: uuid }
    RegistroRequest:
      type: object
      required: [nombre, correo, telefono, clave, rol, aceptaTerminos]
      properties:
        nombre: { type: string, maxLength: 80 }
        correo: { type: string, format: email }
        telefono: { type: string, example: '3001234567' }
        clave: { type: string, format: password, minLength: 8, maxLength: 72 }
        rol: { type: string, enum: [HOGAR, TECNICO] }
        aceptaTerminos: { type: boolean, description: Debe ser true }
    RegistroResponse:
      type: object
      required: [id, rol]
      properties:
        id: { type: integer, format: int64 }
        rol: { type: string }
    LoginRequest:
      type: object
      required: [correo, clave]
      properties:
        correo: { type: string, format: email }
        clave: { type: string, format: password }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, usuarioId, rol, nombre]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, example: 900, description: Segundos de vigencia }
        usuarioId: { type: integer, format: int64 }
        rol: { type: string, enum: [HOGAR, TECNICO, ADMIN] }
        nombre: { type: string }
    PerfilResponse:
      type: object
      description: Datos propios del usuario autenticado
      required: [id, rol, nombre, correo]
      properties:
        id: { type: integer, format: int64 }
        rol: { type: string }
        nombre: { type: string }
        correo: { type: string }
        telefono: { type: string }
    Oficio:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer }
        nombre: { type: string, example: Electricista }
    Ubicacion:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90, example: 7.3772 }
        lng: { type: number, minimum: -180, maximum: 180, example: -72.6473 }
    SolicitudCrear:
      type: object
      required: [oficioId, descripcion, ubicacion]
      properties:
        oficioId: { type: integer, minimum: 1 }
        descripcion: { type: string, minLength: 10, maxLength: 500 }
        ubicacion: { $ref: '#/components/schemas/Ubicacion' }
    ContactoAsignado:
      type: object
      description: Visible solo para las dos partes y solo desde E03
      required: [nombre, telefono]
      properties:
        nombre: { type: string }
        telefono: { type: string, example: '3001234567' }
    SolicitudResponse:
      type: object
      required: [id, estado, descripcion, expiraEn]
      properties:
        id: { type: integer, format: int64 }
        estado: { type: string, enum: [E01, E02, E03, E04, E05, E06, E07] }
        oficioId: { type: integer }
        oficio: { type: string }
        descripcion: { type: string }
        precioAcordadoCop: { type: integer, nullable: true }
        comisionCop: { type: integer, nullable: true }
        expiraEn: { type: string, format: date-time }
        terminadoEn: { type: string, format: date-time, nullable: true }
        hogarId: { type: integer, format: int64 }
        tecnicoId: { type: integer, format: int64, nullable: true }
        motivoCancelacion: { type: string, nullable: true }
        contacto: { allOf: [{ $ref: '#/components/schemas/ContactoAsignado' }], nullable: true }
        distanciaM: { type: integer, nullable: true, description: 'Distancia a la zona de trabajo del técnico, en metros' }
    PostulacionCrear:
      type: object
      required: [precioCop]
      properties:
        precioCop: { type: integer, minimum: 1000, maximum: 5000000 }
        mensaje: { type: string, maxLength: 200, nullable: true }
    PostulacionResponse:
      type: object
      required: [id, tecnicoId, precioCop, estado]
      properties:
        id: { type: integer, format: int64 }
        tecnicoId: { type: integer, format: int64 }
        tecnico: { type: string }
        precioCop: { type: integer }
        mensaje: { type: string, nullable: true }
        estado: { type: string, enum: [ACTIVA, ELEGIDA, DESCARTADA] }
        calificacionPromedio: { type: number, nullable: true }
        calificaciones: { type: integer }
    AsignacionResponse:
      type: object
      required: [solicitudId, estado, comisionRetenidaCop, contacto]
      properties:
        solicitudId: { type: integer, format: int64 }
        estado: { type: string, enum: [E03] }
        comisionRetenidaCop: { type: integer, example: 2000 }
        contacto: { $ref: '#/components/schemas/ContactoAsignado' }
    Cancelacion:
      type: object
      properties:
        motivo: { type: string, maxLength: 200, description: Obligatorio (mínimo 5 caracteres) desde E03 }
    FotoResumen:
      type: object
      required: [id, tipoMime, tamanoBytes, creadaEn]
      properties:
        id: { type: integer, format: int64 }
        tipoMime: { type: string, enum: [image/jpeg, image/png, image/webp] }
        tamanoBytes: { type: integer, nullable: true, description: Nulo en las fotos alojadas en Cloudinary }
        creadaEn: { type: string, format: date-time }
        url: { type: string, format: uri, nullable: true, description: Dirección pública de la foto si vive en Cloudinary; nula si está en la base }
    FirmaSubida:
      type: object
      required: [cloudName, apiKey, timestamp, publicId, allowedFormats, signature, uploadUrl]
      properties:
        cloudName: { type: string }
        apiKey: { type: string }
        timestamp: { type: integer, format: int64 }
        publicId: { type: string }
        allowedFormats: { type: string, example: 'jpg,png,webp' }
        signature: { type: string, description: 'SHA-256 de allowed_formats, public_id y timestamp ordenados, más el secreto' }
        uploadUrl: { type: string, format: uri }
    MensajeCrear:
      type: object
      required: [texto]
      properties:
        texto: { type: string, minLength: 1, maxLength: 500 }
    MensajeResponse:
      type: object
      required: [id, autorId, texto, creadoEn, mio]
      properties:
        id: { type: integer, format: int64 }
        autorId: { type: integer, format: int64 }
        texto: { type: string }
        creadoEn: { type: string, format: date-time }
        mio: { type: boolean }
    CalificacionCrear:
      type: object
      required: [estrellas]
      properties:
        estrellas: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string, maxLength: 300, nullable: true }
    CalificacionResponse:
      type: object
      required: [id, solicitudId, destinatarioId, estrellas, creadaEn]
      properties:
        id: { type: integer, format: int64 }
        solicitudId: { type: integer, format: int64 }
        destinatarioId: { type: integer, format: int64 }
        estrellas: { type: integer }
        comentario: { type: string, nullable: true }
        creadaEn: { type: string, format: date-time }
    Reputacion:
      type: object
      required: [tecnicoId, calificaciones]
      properties:
        tecnicoId: { type: integer, format: int64 }
        promedio: { type: number, nullable: true }
        calificaciones: { type: integer }
    ZonaTrabajo:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        radioKm: { type: integer, minimum: 1, maximum: 50, default: 5 }
    LugarEncontrado:
      type: object
      required: [nombre, lat, lng]
      properties:
        nombre: { type: string, example: 'Carrera 5, Centro, Pamplona, Norte de Santander, Colombia' }
        lat: { type: number, example: 7.3772 }
        lng: { type: number, example: -72.6473 }
    ZonaTrabajoResponse:
      type: object
      required: [lat, lng, radioKm]
      properties:
        lat: { type: number }
        lng: { type: number }
        radioKm: { type: integer }
        actualizadaEn: { type: string, format: date-time }
    RecargaIniciada:
      type: object
      required: [referencia, valorCop, estado, urlPago]
      properties:
        referencia: { type: string, example: SL-3f1c2a9e-8d4b-4c5e-9a67-0b1d2e3f4a5b }
        valorCop: { type: integer, example: 50000 }
        estado: { type: string, enum: [PENDING] }
        urlPago: { type: string, format: uri, description: Web Checkout de Wompi con el monto y la firma de integridad }
    EstadoRecarga:
      type: object
      required: [referencia, valorCop, estado]
      properties:
        referencia: { type: string }
        valorCop: { type: integer }
        estado:
          type: string
          enum: [PENDING, APPROVED, FAILED, REVIEW]
          description: REVIEW = pago aprobado cuyo monto o transacción no cuadran; no se acredita y lo revisa un administrador
    EventoWompi:
      type: object
      required: [event, data, signature, timestamp]
      properties:
        event: { type: string, example: transaction.updated }
        data: { type: object, additionalProperties: true }
        signature:
          type: object
          required: [properties, checksum]
          properties:
            properties: { type: array, items: { type: string }, example: [transaction.id, transaction.status, transaction.amount_in_cents] }
            checksum: { type: string }
        timestamp: { type: integer, format: int64 }
        sent_at: { type: string }
    ResultadoEvento:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [PENDING, APPROVED, FAILED, REVIEW, IGNORADO] }
    RecargaCrear:
      type: object
      required: [valorCop]
      properties:
        valorCop: { type: integer, minimum: 1000, maximum: 1000000 }
    BilleteraResponse:
      type: object
      required: [saldoDisponibleCop, saldoRetenidoCop, movimientos]
      properties:
        saldoDisponibleCop: { type: integer, example: 24000 }
        saldoRetenidoCop: { type: integer, example: 2000 }
        pagoDisponible: { type: boolean, description: Hay llaves de Wompi configuradas en este entorno }
        recargaDemoDisponible: { type: boolean, description: El servidor habilita la recarga de demostración }
        movimientos:
          type: array
          items:
            type: object
            required: [id, tipo, valorCop, fecha, saldoPosteriorCop]
            properties:
              id: { type: integer, format: int64 }
              tipo: { type: string, enum: [RECARGA, RETENCION, COMISION, LIBERACION] }
              valorCop: { type: integer }
              fecha: { type: string, format: date-time }
              saldoPosteriorCop: { type: integer }
    ResumenAdmin:
      type: object
      required: [solicitudesPorEstado, usuariosPorRol, cuentasSuspendidas, comisionesCobradasCop, comisionesRetenidasCop]
      properties:
        solicitudesPorEstado:
          type: object
          additionalProperties: { type: integer }
        usuariosPorRol:
          type: object
          additionalProperties: { type: integer }
        cuentasSuspendidas: { type: integer }
        comisionesCobradasCop: { type: integer }
        comisionesRetenidasCop: { type: integer }
    EstadoCuenta:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        reason: { type: string, minLength: 5, maxLength: 200, description: Obligatorio al suspender }
    MotivoAdmin:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 5, maxLength: 200 }
    UsuarioAdmin:
      type: object
      description: Vista exclusiva del rol ADMIN
      required: [id, rol, nombre, correo, suspendido]
      properties:
        id: { type: integer, format: int64 }
        rol: { type: string }
        nombre: { type: string }
        correo: { type: string }
        telefono: { type: string }
        suspendido: { type: boolean }
        motivoSuspension: { type: string, nullable: true }
    SolicitudAdmin:
      type: object
      required: [id, estado, descripcion, hogarId]
      properties:
        id: { type: integer, format: int64 }
        estado: { type: string }
        oficioId: { type: integer }
        descripcion: { type: string }
        hogarId: { type: integer, format: int64 }
        tecnicoId: { type: integer, format: int64, nullable: true }
        precioAcordadoCop: { type: integer, nullable: true }
        comisionCop: { type: integer, nullable: true }
        expiraEn: { type: string, format: date-time }
        canceladaPor: { type: string, nullable: true }
        motivoCancelacion: { type: string, nullable: true }
    MovimientoAdmin:
      type: object
      required: [id, tecnicoId, tipo, valorCop]
      properties:
        id: { type: integer, format: int64 }
        tecnicoId: { type: integer, format: int64 }
        solicitudId: { type: integer, format: int64, nullable: true }
        tipo: { type: string }
        valorCop: { type: integer }
        saldoPosteriorCop: { type: integer }
        referencia: { type: string, nullable: true }
        creadoEn: { type: string, format: date-time }
    Auditoria:
      type: object
      required: [id, adminId, accion, objetivoTipo, objetivoId, creadaEn]
      properties:
        id: { type: integer, format: int64 }
        adminId: { type: integer, format: int64 }
        accion: { type: string, enum: [SUSPENDER_USUARIO, REACTIVAR_USUARIO, CANCELAR_SOLICITUD] }
        objetivoTipo: { type: string }
        objetivoId: { type: integer, format: int64 }
        detalle: { type: string, nullable: true }
        creadaEn: { type: string, format: date-time }
    PaginaUsuarios:
