name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 1 · Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend-ref/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar herramientas
        run: pip install ruff openapi-spec-validator pyyaml
      - name: Python (ruff)
        run: ruff check .
      - name: Java (javac con advertencias como error)
        run: |
          mkdir -p "$RUNNER_TEMP/lint"
          javac -Xlint:all -Werror -encoding UTF-8 -d "$RUNNER_TEMP/lint" \
            negociacion/src/servilink/negociacion/*.java
      - name: Contrato OpenAPI (esquema, seguridad y privacidad)
        run: |
          python contrato/validar.py contrato/openapi.yaml
          python contrato/validar.py contrato/openapi-referencia.yaml

  test:
    name: 2 · Pruebas y cobertura
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend-ref/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Pruebas Java (TDD de negociación)
        run: bash negociacion/run.sh
      - name: Pruebas de integración y contrato (cobertura mínima 90 %)
        working-directory: backend-ref
        run: |
          pip install -r requirements.txt
          python -m pytest -v --cov=servilink_ref --cov-report=xml \
            --cov-report=term --cov-fail-under=90
      - name: Empaquetar artefacto inmutable (nombre = commit)
        run: |
          mkdir -p dist
          zip -qr "dist/servilink-backend-ref-${GITHUB_SHA}.zip" backend-ref contrato \
            -x "*/__pycache__/*" "*/.pytest_cache/*"
      - uses: actions/upload-artifact@v4
        with:
          name: servilink-backend-ref-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: backend-ref/coverage.xml

  backend-spring:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_DB: servilink_test, POSTGRES_PASSWORD: ci-password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/servilink_test
      TEST_POSTGRES_USER: postgres
      TEST_POSTGRES_PASSWORD: ci-password
      JWT_SECRET: ci-secreto-de-pruebas-con-mas-de-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend-spring
          path: backend/target/site/jacoco
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  analysis:
    name: 3 · Análisis estático y Quality Gate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # SonarCloud necesita el historial completo
      - uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: backend-ref
      - name: SonarCloud (rompe el build si el Quality Gate falla)
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  imagen:
    name: 4 · Imagen Docker
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dockerfile (hadolint)
        run: |
          pip install hadolint-py
          hadolint backend-ref/Dockerfile
      - name: Credenciales efímeras solo para esta prueba
        run: |
          {
            echo "POSTGRES_USER=servilink"
            echo "POSTGRES_DB=servilink"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env
      - name: Validar el compose y construir la imagen
        run: |
          docker compose config -q
          docker compose build
      - name: Prueba de humo (levanta todo y espera a que esté sano)
        run: docker compose up -d --wait --wait-timeout 120
      - name: Comprobar /salud, usuario no root y base sin puertos publicados
        run: |
          curl -fsS http://127.0.0.1:8000/salud
          test "$(docker compose exec -T api id -u)" = "10001"
          test -z "$(docker compose port db 5432 2>/dev/null || true)"
      - name: Peso de la imagen
        run: docker image ls servilink-api --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'
      - name: Exportar la imagen (artefacto inmutable, nombrado con el commit)
        run: |
          mkdir -p dist
          docker save "servilink-api:${IMAGE_TAG}" | gzip > "dist/servilink-api-${IMAGE_TAG}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: servilink-api-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Registros de los contenedores (solo si algo falló)
        if: failure()
        run: docker compose logs --no-color
      - name: Limpiar
        if: always()
        run: docker compose down -v
