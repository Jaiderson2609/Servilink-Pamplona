name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 1 · Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend-ref/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar herramientas
        run: pip install ruff openapi-spec-validator pyyaml
      - name: Python (ruff)
        run: ruff check .
      - name: Java (javac con advertencias como error)
        run: |
          mkdir -p "$RUNNER_TEMP/lint"
          javac -Xlint:all -Werror -encoding UTF-8 -d "$RUNNER_TEMP/lint" \
            negociacion/src/servilink/negociacion/*.java
      - name: Contrato OpenAPI (esquema, seguridad y privacidad)
        run: python contrato/validar.py contrato/openapi.yaml

  test:
    name: 2 · Pruebas y cobertura
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend-ref/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Pruebas Java (TDD de negociación)
        run: bash negociacion/run.sh
      - name: Pruebas de integración y contrato (cobertura mínima 90 %)
        working-directory: backend-ref
        run: |
          pip install -r requirements.txt
          python -m pytest -v --cov=servilink_ref --cov-report=xml \
            --cov-report=term --cov-fail-under=90
      - name: Empaquetar artefacto inmutable (nombre = commit)
        run: |
          mkdir -p dist
          zip -qr "dist/servilink-backend-ref-${GITHUB_SHA}.zip" backend-ref contrato \
            -x "*/__pycache__/*" "*/.pytest_cache/*"
      - uses: actions/upload-artifact@v7
        with:
          name: servilink-backend-ref-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: backend-ref/coverage.xml

  analysis:
    name: 3 · Análisis estático y Quality Gate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # SonarCloud necesita el historial completo
      - uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: backend-ref
      - name: SonarCloud (rompe el build si el Quality Gate falla)
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300