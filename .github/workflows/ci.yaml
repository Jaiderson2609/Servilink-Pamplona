name: CI Pipeline - Servilink

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos de ejecución a Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas y compilación
        run: ./mvnw clean test

      - name: Análisis con SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw sonar:sonar -Dsonar.organization=jaiderson2609 -Dsonar.projectKey=Jaiderson2609_Servilink-Pamplona -Dsonar.host.url=https://sonarcloud.io